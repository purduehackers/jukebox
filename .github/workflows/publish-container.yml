name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Docker build context
        # Docker does not read Podman's .containerignore.
        run: cp .containerignore .dockerignore

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Upload release and source maps to Sentry
        # Optional: needs the org:ci auth token in the SENTRY_AUTH_TOKEN secret.
        # The release matches the sha-<git sha> image tag; the same build also
        # bakes JUKEBOX_SENTRY_RELEASE into the image via the SENTRY_RELEASE
        # build arg below.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: purduehackers
          SENTRY_PROJECT: jukebox
          SENTRY_RELEASE: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN secret not set; skipping Sentry release/source-map upload"
            exit 0
          fi
          bun install --frozen-lockfile
          bun run build
          bunx --bun @sentry/cli@3 releases new "$SENTRY_RELEASE"
          bunx --bun @sentry/cli@3 sourcemaps inject ./dist
          bunx --bun @sentry/cli@3 sourcemaps upload --release "$SENTRY_RELEASE" ./dist
          bunx --bun @sentry/cli@3 releases finalize "$SENTRY_RELEASE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SENTRY_RELEASE=sha-${{ github.sha }}
          tags: |
            ghcr.io/purduehackers/jukebox:latest
            ghcr.io/purduehackers/jukebox:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    permissions: {}
    steps:
      - name: Update production container
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST_KEY:?Set SSH_HOST_KEY in the Production environment}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$SSH_HOST_KEY" > "$ssh_dir/known_hosts"

          # authorized_keys forces podman auto-update; send no remote command.
          ssh -T -p 10022 -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            p-jukebox@phack.sh
